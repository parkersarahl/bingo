<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Math Bingo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 36px 32px 40px;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.3px;
      margin: 0 0 28px;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.4);
    }

    /* ── Board ── */
    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .cell {
      aspect-ratio: 1;
      border: none;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.93);
      color: #1a1a2e;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .equation-cell {
      font-size: 0.9rem;
      padding: 4px;
    }

    .cell:hover {
      transform: translateY(-3px) scale(1.06);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 4px 14px rgba(251,191,36,0.5); }
      50%       { transform: scale(1.09); box-shadow: 0 10px 28px rgba(251,191,36,0.8); }
    }

    .highlight {
      background: #fbbf24 !important;
      color: #1a1a2e !important;
      animation: pulse 0.85s ease-in-out infinite;
    }

    .marked {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      color: white !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.45) !important;
    }

    .free {
      background: linear-gradient(135deg, #a78bfa, #7c3aed) !important;
      color: white !important;
      font-size: 0.8rem !important;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.45) !important;
    }

    /* ── Question card ── */
    #question-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 18px 24px;
      margin-bottom: 16px;
    }

    #question {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
      margin: 0;
    }

    /* ── Answer buttons ── */
    #answerButtons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .answer-btn {
      min-width: 76px;
      height: 58px;
      padding: 0 22px;
      border: none;
      border-radius: 50px;
      font-size: 1.35rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .answer-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(99, 102, 241, 0.6);
    }

    /* ── Message ── */
    #message {
      font-size: 1rem;
      font-weight: 700;
      min-height: 24px;
      margin-bottom: 6px;
    }

    .success { color: #34d399; }
    .error   { color: #f87171; }
    .info    { color: #93c5fd; }

    /* ── End screen ── */
    #endScreen { margin-top: 18px; }

    #endMessage {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      margin: 0 0 16px;
    }

    #endScreen button {
      padding: 12px 26px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      margin: 5px;
      transition: background 0.2s, transform 0.15s;
    }

    #endScreen button:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="game-card">
    <h1 id="pageTitle">🎉 Math Bingo 🎉</h1>

    <div id="board" class="board"></div>

    <div id="question-card">
      <p id="question">Question:</p>
    </div>

    <div id="answerButtons"></div>

    <div id="message"></div>

    <div id="endScreen" style="display:none;">
      <p id="endMessage"></p>
      <button onclick="playAgain()">🔄 Play Again</button>
      <button onclick="goHome()">🏠 Home</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const bingoSound = new Audio('../audioClips/bingo.m4a');
    bingoSound.preload = 'auto';

    const BOARDS = {
      plus0:  [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,0,7,2,3],[4,9,3,6,1]],
      plus1:  [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,13,7,2,3],[4,9,3,6,1]],
      plus2:  [[11,13,13,8,12],[4,7,12,11,8],[2,9,0,10,7],[14,2,5,6,5],[10,4,9,6,3]],
      plus3:  [[11,13,13,8,12],[4,7,12,11,8],[14,9,0,10,7],[14,15,5,6,5],[10,4,9,6,3]],
      plus4:  [[11,13,16,8,12],[4,7,12,11,8],[14,9,0,10,7],[14,15,5,6,5],[10,4,9,6,13]],
      plus5:  [[11,13,16,8,12],[5,17,12,11,8],[14,9,0,10,7],[17,15,12,6,5],[10,14,9,16,13]],
      plus6:  [[6,13,16,8,12],[18,17,6,11,8],[14,9,0,10,7],[17,15,12,18,5],[10,14,9,16,13]],
      plus7:  [[19,13,16,8,15],[18,17,12,11,8],[14,9,0,10,7],[19,15,12,18,11],[10,14,9,16,13]],
      plus8:  [[20,13,16,8,15],[18,17,12,11,8],[14,9,0,10,7],[20,15,12,18,11],[10,14,9,16,13]],
      plus9:  [[21,13,16,9,15],[18,17,12,11,9],[14,9,0,10,7],[21,15,12,18,11],[10,14,9,16,13]],
      plus10: [[22,13,16,10,15],[18,17,12,11,10],[14,9,0,10,7],[22,15,12,18,11],[10,14,9,16,13]],
      minus0: [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,0,7,2,3],[4,9,3,6,1]],
      minus1: [[11,8,2,9,11],[6,10,1,4,10],[0,5,0,8,2],[7,0,7,2,3],[4,9,3,6,1]],
      minus2: [[11,12,3,8,12],[4,7,2,11,8],[2,9,0,10,7],[1,2,5,6,5],[10,4,9,0,3]],
      minus3: [[11,2,0,8,12],[4,7,12,11,8],[3,9,0,10,7],[2,1,5,6,5],[10,4,9,6,3]],
      minus4: [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,5,0,2,3],[4,9,3,6,1]],
      minus5: [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,5,0,2,3],[4,9,3,6,1]],
      minus6: [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,5,0,2,3],[4,9,3,6,1]],
      minus7: [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,5,0,2,3],[4,9,3,6,1]],
      minus8: [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,5,0,2,3],[4,9,3,6,1]],
      minus9: [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,5,0,2,3],[4,9,3,6,1]],
      minus10:[[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,5,0,2,3],[4,9,3,6,1]],
    };

    const MIXED_MAX = 10;

    const params = new URLSearchParams(location.search);
    const op = params.get('op') || 'plus';
    const n  = parseInt(params.get('n') || '0');
    const isMixedAddition = op === 'mixed';
    const isMixedSubtraction = op === 'mixed-minus';
    const isWithin100Addition = op === 'within100-plus';
    const isWithin100Subtraction = op === 'within100-minus';
    const isEquationMatch = isWithin100Addition || isWithin100Subtraction;
    const key = isMixedAddition || isMixedSubtraction ? op : `${op}${n}`;

    function shuffle(items) {
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function createMixedBoard(maxResult) {
      const numbers = Array.from({ length: maxResult + 1 }, (_, value) => value);
      while (numbers.length < 24) {
        numbers.push(Math.floor(Math.random() * (maxResult + 1)));
      }
      shuffle(numbers);

      const board = [];
      let numberIndex = 0;
      for (let i = 0; i < 5; i++) {
        board[i] = [];
        for (let j = 0; j < 5; j++) {
          board[i][j] = (i === 2 && j === 2) ? 0 : numbers[numberIndex++];
        }
      }
      return board;
    }

    const boardNumbers = isMixedAddition
      ? createMixedBoard(MIXED_MAX * 2)
      : isMixedSubtraction
        ? createMixedBoard(MIXED_MAX)
        : isEquationMatch
          ? null
        : BOARDS[key];
    if (!boardNumbers && !isEquationMatch) {
      document.body.innerHTML = '<p style="font-size:1.5rem;margin-top:40px;color:white;">Unknown level. <a href="./" style="color:#93c5fd">Go back</a>.</p>';
      throw new Error('Unknown level: ' + key);
    }

    const label = isMixedAddition
      ? 'Mixed Addition'
      : isMixedSubtraction
        ? 'Mixed Subtraction'
        : isWithin100Addition
          ? 'Addition Match Within 100'
          : isWithin100Subtraction
            ? 'Subtraction Match Within 100'
        : op === 'plus' ? `Plus ${n}` : `Minus ${n}`;
    document.title = `${label} Bingo`;
    document.getElementById('pageTitle').textContent = `🎉 ${label} Bingo 🎉`;

    const boardEl         = document.getElementById('board');
    const questionEl      = document.getElementById('question');
    const answerButtonsEl = document.getElementById('answerButtons');
    const messageEl       = document.getElementById('message');

    let equationBoard = null;
    let marks = Array.from({ length: 5 }, () => Array(5).fill(false));
    let buttons = [];
    let allEquations = [];
    let currentEquationIndex = 0;
    let answer;

    function showMessage(text, type = 'info') {
      messageEl.textContent = text;
      messageEl.className = type;
    }

    function createEquationBoard() {
      const equationsByAnswer = new Map();
      allEquations.forEach(eq => {
        if (!equationsByAnswer.has(eq.answer)) equationsByAnswer.set(eq.answer, eq);
      });

      const entries = shuffle(Array.from(equationsByAnswer.values())).slice(0, 24);
      const board = [];
      let entryIndex = 0;
      for (let i = 0; i < 5; i++) {
        board[i] = [];
        for (let j = 0; j < 5; j++) {
          board[i][j] = (i === 2 && j === 2) ? null : entries[entryIndex++];
        }
      }
      return board;
    }

    function createBoard() {
      boardEl.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        buttons[i] = [];
        for (let j = 0; j < 5; j++) {
          const btn = document.createElement('button');
          btn.className = 'cell';
          const cell = equationBoard ? equationBoard[i][j] : boardNumbers[i][j];
          if (equationBoard && cell) {
            btn.classList.add('equation-cell');
            btn.textContent = cell.question.replace('What is ', '').replace('?', '');
          } else {
            btn.textContent = (i === 2 && j === 2) ? 'FREE' : cell;
          }
          btn.addEventListener('click', () => markCell(i, j));
          boardEl.appendChild(btn);
          buttons[i][j] = btn;
        }
      }
      marks[2][2] = true;
      buttons[2][2].classList.add('free');
    }

    function generateEquations() {
      allEquations = [];
      if (isWithin100Addition) {
        for (let a = 0; a <= 100; a++) {
          for (let b = 0; b <= 100 - a; b++) {
            allEquations.push({ question: `What is ${a} + ${b}?`, answer: a + b });
          }
        }
      } else if (isWithin100Subtraction) {
        for (let a = 0; a <= 100; a++) {
          for (let b = 0; b <= a; b++) {
            allEquations.push({ question: `What is ${a} - ${b}?`, answer: a - b });
          }
        }
      } else if (op === 'plus') {
        for (let b = 0; b <= 12; b++) {
          allEquations.push({ question: `What is ${n} + ${b}?`, answer: n + b });
        }
      } else if (op === 'minus') {
        for (let b = n; b <= n + 12; b++) {
          allEquations.push({ question: `What is ${b} - ${n}?`, answer: b - n });
        }
      } else if (isMixedSubtraction) {
        for (let a = 0; a <= MIXED_MAX; a++) {
          for (let b = 0; b <= a; b++) {
            allEquations.push({ question: `What is ${a} - ${b}?`, answer: a - b });
          }
        }
      } else {
        for (let a = 0; a <= MIXED_MAX; a++) {
          for (let b = 0; b <= MIXED_MAX; b++) {
            allEquations.push({ question: `What is ${a} + ${b}?`, answer: a + b });
          }
        }
      }
      allEquations.sort(() => Math.random() - 0.5);
      currentEquationIndex = 0;
    }

    function newQuestion() {
      if (currentEquationIndex >= allEquations.length) {
        endGame('No more questions — Game Over!');
        return;
      }

      const eq = allEquations[currentEquationIndex];
      answer = eq.answer;
      questionEl.textContent = eq.question;
      showMessage('', 'info');

      answerButtonsEl.innerHTML = '';
      const options = [answer];
      const optionMax = isEquationMatch ? 100 : 22;
      while (options.length < 4) {
        const rand = Math.floor(Math.random() * (optionMax + 1));
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.className = 'answer-btn';
        btn.addEventListener('click', () => checkAnswer(opt));
        answerButtonsEl.appendChild(btn);
      });
    }

    function checkAnswer(userAns) {
      if (userAns === answer) {
        showMessage('✅ Correct! Click a highlighted cell.', 'success');
        const available = [];
        for (let i = 0; i < 5; i++) {
          for (let j = 0; j < 5; j++) {
            const cellAnswer = equationBoard ? equationBoard[i][j]?.answer : boardNumbers[i][j];
            if (cellAnswer === answer && !marks[i][j] && !(i === 2 && j === 2)) {
              available.push([i, j]);
            }
          }
        }
        if (available.length > 0) {
          available.forEach(([i, j]) => buttons[i][j].classList.add('highlight'));
        } else {
          showMessage('ℹ️ Correct, but number not on board. Skipping...', 'info');
          currentEquationIndex++;
          newQuestion();
        }
      } else {
        showMessage('❌ Wrong! Try again.', 'error');
      }
    }

    function markCell(i, j) {
      if (buttons[i][j].classList.contains('highlight')) {
        marks[i][j] = true;
        buttons[i][j].classList.remove('highlight');
        buttons[i][j].classList.add('marked');
        clearHighlights();
        if (checkWin()) celebrateWin();
        else {
          currentEquationIndex++;
          newQuestion();
        }
      }
    }

    function clearHighlights() {
      for (let i = 0; i < 5; i++)
        for (let j = 0; j < 5; j++)
          buttons[i][j].classList.remove('highlight');
    }

    function checkWin() {
      for (const row of marks) if (row.every(x => x)) return true;
      for (let col = 0; col < 5; col++) if (marks.every(row => row[col])) return true;
      if ([0,1,2,3,4].every(i => marks[i][i])) return true;
      if ([0,1,2,3,4].every(i => marks[i][4-i])) return true;
      return false;
    }

    function celebrateWin() {
      confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
      bingoSound.currentTime = 0;
      bingoSound.play().catch(() => {});
      endGame('🎉 BINGO! You win! 🎉');
    }

    function endGame(message) {
      document.getElementById('endMessage').textContent = message;
      document.getElementById('endScreen').style.display = 'block';
      answerButtonsEl.innerHTML = '';
    }

    function playAgain() { location.reload(); }
    function goHome() {
      window.location.href = isEquationMatch
        ? 'second-grade.html'
        : '../index.html';
    }

    generateEquations();
    if (isEquationMatch) {
      equationBoard = createEquationBoard();
      allEquations = equationBoard.flat().filter(Boolean);
      shuffle(allEquations);
    }
    createBoard();
    newQuestion();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
