<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Math Bingo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      margin: 20px;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      color: #333;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #222;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .cell {
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      box-shadow: 0 3px 5px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }

    .cell:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 8px rgba(0,0,0,0.15);
    }

    .highlight { background: #FFD93D !important; }

    .marked, .free {
      background: #6BCB77 !important;
      color: white;
    }

    #question {
      font-size: 1.2rem;
      margin: 10px 0;
    }

    #message {
      font-size: 1rem;
      margin: 10px 0;
      min-height: 20px;
      font-weight: bold;
    }

    #endScreen button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #4D96FF;
      color: white;
      border: none;
      border-radius: 8px;
      margin: 5px;
      box-shadow: 0 3px 5px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }

    #endScreen button:hover { background: #2563eb; }

    #answerButtons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    .success { color: #2E7D32; }
    .error   { color: #D32F2F; }
    .info    { color: #1976D2; }
  </style>
</head>
<body>

  <h1 id="pageTitle">🎉 Math Bingo 🎉</h1>

  <div id="board" class="board"></div>

  <h2 id="question">Question:</h2>
  <div id="answerButtons"></div>

  <div id="message"></div>

  <div id="endScreen" style="display:none; margin-top:20px;">
    <h2 id="endMessage"></h2>
    <button onclick="playAgain()">🔄 Play Again</button>
    <button onclick="goHome()">🏠 Return to Homepage</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const BOARDS = {
      plus0:  [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,0,7,2,3],[4,9,3,6,1]],
      plus1:  [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,13,7,2,3],[4,9,3,6,1]],
      plus2:  [[11,13,13,8,12],[4,7,12,11,8],[2,9,0,10,7],[14,2,5,6,5],[10,4,9,6,3]],
      plus3:  [[11,13,13,8,12],[4,7,12,11,8],[14,9,0,10,7],[14,15,5,6,5],[10,4,9,6,3]],
      plus4:  [[11,13,16,8,12],[4,7,12,11,8],[14,9,0,10,7],[14,15,5,6,5],[10,4,9,6,13]],
      plus5:  [[11,13,16,8,12],[5,17,12,11,8],[14,9,0,10,7],[17,15,12,6,5],[10,14,9,16,13]],
      plus6:  [[6,13,16,8,12],[18,17,6,11,8],[14,9,0,10,7],[17,15,12,18,5],[10,14,9,16,13]],
      plus7:  [[19,13,16,8,15],[18,17,12,11,8],[14,9,0,10,7],[19,15,12,18,11],[10,14,9,16,13]],
      minus0: [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,0,7,2,3],[4,9,3,6,1]],
      minus1: [[11,8,2,9,11],[6,10,1,4,10],[0,5,0,8,2],[7,0,7,2,3],[4,9,3,6,1]],
      minus2: [[11,12,3,8,12],[4,7,2,11,8],[2,9,0,10,7],[1,2,5,6,5],[10,4,9,0,3]],
      minus3: [[11,2,0,8,12],[4,7,12,11,8],[3,9,0,10,7],[2,1,5,6,5],[10,4,9,6,3]],
      minus4: [[11,8,12,9,11],[6,10,1,4,10],[12,5,0,8,2],[7,5,0,2,3],[4,9,3,6,1]],
      mixed:  [[15,8,12,5,18],[2,10,7,16,11],[20,4,0,9,13],[6,17,3,10,1],[14,9,19,11,0]],
    };

    const params = new URLSearchParams(location.search);
    const op = params.get('op') || 'plus';
    const n  = parseInt(params.get('n') || '0');
    const key = op === 'mixed' ? 'mixed' : `${op}${n}`;

    const boardNumbers = BOARDS[key];
    if (!boardNumbers) {
      document.body.innerHTML = '<p style="font-size:1.5rem;margin-top:40px;">Unknown level. <a href="./">Go back</a>.</p>';
      throw new Error('Unknown level: ' + key);
    }

    const label = op === 'mixed' ? 'Mixed Addition' : op === 'plus' ? `Plus ${n}` : `Minus ${n}`;
    document.title = `${label} Bingo`;
    document.getElementById('pageTitle').textContent = `🎉 ${label} Bingo 🎉`;

    const boardEl         = document.getElementById('board');
    const questionEl      = document.getElementById('question');
    const answerButtonsEl = document.getElementById('answerButtons');
    const messageEl       = document.getElementById('message');

    let marks = Array.from({ length: 5 }, () => Array(5).fill(false));
    let buttons = [];
    let allEquations = [];
    let currentEquationIndex = 0;
    let answer;

    function showMessage(text, type = 'info') {
      messageEl.textContent = text;
      messageEl.className = type;
    }

    function createBoard() {
      boardEl.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        buttons[i] = [];
        for (let j = 0; j < 5; j++) {
          const btn = document.createElement('button');
          btn.className = 'cell';
          btn.textContent = (i === 2 && j === 2) ? 'FREE' : boardNumbers[i][j];
          btn.addEventListener('click', () => markCell(i, j));
          boardEl.appendChild(btn);
          buttons[i][j] = btn;
        }
      }
      marks[2][2] = true;
      buttons[2][2].classList.add('free');
    }

    function generateEquations() {
      allEquations = [];
      if (op === 'plus') {
        for (let b = 0; b <= 12; b++) {
          allEquations.push({ question: `What is ${n} + ${b}?`, answer: n + b });
        }
      } else if (op === 'minus') {
        for (let b = n; b <= n + 12; b++) {
          allEquations.push({ question: `What is ${b} - ${n}?`, answer: b - n });
        }
      } else {
        for (let a = 0; a <= 10; a++) {
          for (let b = 0; b <= 10; b++) {
            allEquations.push({ question: `What is ${a} + ${b}?`, answer: a + b });
          }
        }
      }
      allEquations.sort(() => Math.random() - 0.5);
      currentEquationIndex = 0;
    }

    function newQuestion() {
      if (currentEquationIndex >= allEquations.length) {
        endGame('No more questions — Game Over!');
        return;
      }

      const eq = allEquations[currentEquationIndex];
      answer = eq.answer;
      questionEl.textContent = eq.question;
      showMessage('', 'info');

      answerButtonsEl.innerHTML = '';
      const options = [answer];
      while (options.length < 4) {
        const rand = Math.floor(Math.random() * 22);
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.className = 'cell';
        btn.style.width = '60px';
        btn.style.height = '60px';
        btn.addEventListener('click', () => checkAnswer(opt));
        answerButtonsEl.appendChild(btn);
      });
    }

    function checkAnswer(userAns) {
      if (userAns === answer) {
        showMessage('✅ Correct! Click a highlighted cell.', 'success');
        const available = [];
        for (let i = 0; i < 5; i++) {
          for (let j = 0; j < 5; j++) {
            if (boardNumbers[i][j] === answer && !marks[i][j] && !(i === 2 && j === 2)) {
              available.push([i, j]);
            }
          }
        }
        if (available.length > 0) {
          available.forEach(([i, j]) => buttons[i][j].classList.add('highlight'));
        } else {
          showMessage('ℹ️ Correct, but number not on board. Skipping...', 'info');
          currentEquationIndex++;
          newQuestion();
        }
      } else {
        showMessage('❌ Wrong! Try again.', 'error');
      }
    }

    function markCell(i, j) {
      if (buttons[i][j].classList.contains('highlight')) {
        marks[i][j] = true;
        buttons[i][j].classList.remove('highlight');
        buttons[i][j].classList.add('marked');
        clearHighlights();
        if (checkWin()) celebrateWin();
        else {
          currentEquationIndex++;
          newQuestion();
        }
      }
    }

    function clearHighlights() {
      for (let i = 0; i < 5; i++)
        for (let j = 0; j < 5; j++)
          buttons[i][j].classList.remove('highlight');
    }

    function checkWin() {
      for (const row of marks) if (row.every(x => x)) return true;
      for (let col = 0; col < 5; col++) if (marks.every(row => row[col])) return true;
      if ([0,1,2,3,4].every(i => marks[i][i])) return true;
      if ([0,1,2,3,4].every(i => marks[i][4-i])) return true;
      return false;
    }

    function celebrateWin() {
      confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
      endGame('🎉 BINGO! You win! 🎉');
    }

    function endGame(message) {
      document.getElementById('endMessage').textContent = message;
      document.getElementById('endScreen').style.display = 'block';
      answerButtonsEl.innerHTML = '';
    }

    function playAgain() { location.reload(); }
    function goHome() { window.location.href = '../index.html'; }

    createBoard();
    generateEquations();
    newQuestion();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
