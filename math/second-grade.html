<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2nd Grade Math Bingo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      margin: 0 0 36px;
      text-shadow: 0 2px 24px rgba(0,0,0,0.4);
      text-align: center;
    }

    .menu-card {
      width: 100%;
      max-width: 520px;
      padding: 36px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-label {
      margin: 0 0 10px;
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .game-link {
      min-height: 84px;
      padding: 18px 24px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: #fff;
      text-decoration: none;
      font-size: 1.25rem;
      font-weight: 900;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    }

    .addition-link {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      box-shadow: 0 4px 14px rgba(99,102,241,0.4);
    }

    .subtraction-link {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      box-shadow: 0 4px 14px rgba(244,63,94,0.4);
    }

    .symbol {
      width: 42px;
      font-size: 2rem;
      line-height: 1;
      text-align: center;
    }

    .home-link {
      margin-top: 24px;
      color: rgba(255,255,255,0.45);
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
    }

    .home-link:hover { color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>
  <h1>2nd Grade Math Bingo</h1>

  <div class="menu-card">
    <div>
      <p class="section-label">Addition</p>
      <a class="game-link addition-link" href="bingo.html?op=within100-plus">
        <span class="symbol">+</span>
        <span>Addition Within 100</span>
      </a>
    </div>

    <div>
      <p class="section-label">Subtraction</p>
      <a class="game-link subtraction-link" href="bingo.html?op=within100-minus">
        <span class="symbol">-</span>
        <span>Subtraction Within 100</span>
      </a>
    </div>
  </div>

  <a class="home-link" href="../second-grade.html">Back to 2nd Grade Games</a>
</body>
</html>
