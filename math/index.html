<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Math Bingo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      margin: 0 0 36px;
      text-shadow: 0 2px 24px rgba(0,0,0,0.4);
    }

    .menu-card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 32px;
      padding: 40px 36px;
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .section-label {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin: 0 0 14px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Addition buttons — indigo */
    .addition-btn {
      width: 72px;
      height: 72px;
      border: none;
      border-radius: 18px;
      font-size: 1.25rem;
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      box-shadow: 0 4px 14px rgba(99,102,241,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .addition-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(99,102,241,0.6);
    }

    /* Mixed button — emerald */
    .mixed-btn {
      height: 72px;
      padding: 0 32px;
      border: none;
      border-radius: 18px;
      font-size: 1.2rem;
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 14px rgba(16,185,129,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .mixed-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(16,185,129,0.6);
    }

    /* Subtraction buttons — rose */
    .minus-btn {
      width: 72px;
      height: 72px;
      border: none;
      border-radius: 18px;
      font-size: 1.25rem;
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: white;
      box-shadow: 0 4px 14px rgba(244,63,94,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .minus-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(244,63,94,0.6);
    }

    .home-link {
      margin-top: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }

    .home-link:hover { color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>
  <h1>🎉 Math Bingo 🎉</h1>

  <div class="menu-card">
    <div>
      <p class="section-label">Addition</p>
      <div class="button-group">
        <button class="addition-btn" onclick="location.href='bingo.html?op=plus&n=0'">+0</button>
        <button class="addition-btn" onclick="location.href='bingo.html?op=plus&n=1'">+1</button>
        <button class="addition-btn" onclick="location.href='bingo.html?op=plus&n=2'">+2</button>
        <button class="addition-btn" onclick="location.href='bingo.html?op=plus&n=3'">+3</button>
        <button class="addition-btn" onclick="location.href='bingo.html?op=plus&n=4'">+4</button>
        <button class="addition-btn" onclick="location.href='bingo.html?op=plus&n=5'">+5</button>
        <button class="addition-btn" onclick="location.href='bingo.html?op=plus&n=6'">+6</button>
        <button class="addition-btn" onclick="location.href='bingo.html?op=plus&n=7'">+7</button>
      </div>
    </div>

    <div>
      <p class="section-label">Mixed Addition (0–20)</p>
      <div class="button-group">
        <button class="mixed-btn" onclick="location.href='bingo.html?op=mixed'">Mix It Up!</button>
      </div>
    </div>

    <div>
      <p class="section-label">Subtraction</p>
      <div class="button-group">
        <button class="minus-btn" onclick="location.href='bingo.html?op=minus&n=0'">−0</button>
        <button class="minus-btn" onclick="location.href='bingo.html?op=minus&n=1'">−1</button>
        <button class="minus-btn" onclick="location.href='bingo.html?op=minus&n=2'">−2</button>
        <button class="minus-btn" onclick="location.href='bingo.html?op=minus&n=3'">−3</button>
        <button class="minus-btn" onclick="location.href='bingo.html?op=minus&n=4'">−4</button>
      </div>
    </div>
  </div>

  <a class="home-link" href="../index.html">🏠 Back to School Games</a>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
